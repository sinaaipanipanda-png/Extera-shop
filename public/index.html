<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه ستاره‌ای</title>
    <!-- اتصال به فونت وزیرمتن -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); 
            min-height: 100vh;
            margin: 0; 
            padding: 20px 10px; 
            text-align: center; 
            color: #f8fafc; 
        }

        /* استایل کارت‌های شیشه‌ای (گلس‌مورفیسم) */
        .glass-card { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.18); 
            border-radius: 20px; 
            padding: 25px; 
            max-width: 500px; 
            margin: 20px auto; 
            text-align: right; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2, h3 { text-align: center; color: #ffffff; margin-top: 0; font-weight: 700; }
        
        input, button, textarea { 
            width: 100%; 
            padding: 12px 16px; 
            margin: 10px 0; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            font-size: 14px; 
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder { color: #94a3b8; }
        
        input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        button { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: 700; 
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        .btn-blue { 
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); 
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-danger { 
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); 
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-warning { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); 
            color: #ffffff; 
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .hidden { display: none; }

        .star-badge { 
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); 
            color: #1e1b4b; 
            padding: 8px 18px; 
            border-radius: 30px; 
            font-weight: 800; 
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
        }

        .glass-item { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 15px; 
            border-radius: 14px; 
            margin-bottom: 12px; 
        }

        .glass-item img { 
            width: 100%; 
            max-height: 160px; 
            object-fit: cover; 
            border-radius: 10px; 
        }

        .flex-btn { display: flex; gap: 6px; margin-top: 8px; }
        .flex-btn button { flex: 1; padding: 8px; font-size: 12px; }

        .stats-box { 
            background: rgba(56, 189, 248, 0.1); 
            border: 1px solid rgba(56, 189, 248, 0.2); 
            padding: 12px; 
            border-radius: 12px; 
            text-align: center; 
            font-size: 13px; 
            font-weight: 700; 
            margin-bottom: 18px; 
            color: #38bdf8;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
        .status-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <!-- صفحه ورود و ثبت نام -->
    <div id="auth-section" class="glass-card">
        <h2 id="auth-title">ورود به حساب</h2>
        <input type="text" id="username" placeholder="نام کاربری">
        <input type="password" id="password" placeholder="رمز عبور">
        <button onclick="login()">ورود</button>
        <button class="btn-blue" onclick="register()">ثبت‌نام (۱۰ ستاره هدیه)</button>
        <p id="auth-msg" style="color: #f87171; text-align: center; font-weight: bold; line-height: 1.6;"></p>
    </div>

    <!-- پنل کاربر عادی -->
    <div id="user-section" class="glass-card hidden">
        <h2>خوش آمدید <span id="user-name"></span> 👋</h2>
        <div style="text-align: center; margin-bottom: 18px;">
            موجودی حساب: <span id="user-stars" class="star-badge">0 ⭐</span>
        </div>
        <button class="btn-danger" onclick="logout()">خروج از حساب</button>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
        <h3>🛍 فروشگاه محصولات</h3>
        <div id="products-list"></div>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
        <h3>📦 سفارش‌های من</h3>
        <div id="user-orders-list"></div>
    </div>

    <!-- پنل مدیریت (ادمین) -->
    <div id="admin-section" class="glass-card hidden" style="max-width: 650px;">
        <h2>⚙️ پنل مدیریت</h2>
        <div id="admin-stats" class="stats-box">در حال بارگذاری آمار...</div>
        <button class="btn-danger" onclick="logout()">خروج از پنل مدیریت</button>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
        <h3>➕ افزودن محصول جدید</h3>
        <input type="text" id="prod-name" placeholder="نام محصول">
        <input type="number" id="prod-price" placeholder="قیمت (تعداد ستاره)">
        <input type="text" id="prod-desc" placeholder="توضیحات محصول">
        <input type="text" id="prod-img" placeholder="لینک تصویر محصول (اختیاری)">
        <button onclick="addProduct()">افزودن به فروشگاه</button>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
        <h3>👥 مدیریت کاربران و ستاره‌ها</h3>
        <input type="text" id="search-user" placeholder="🔍 جستجوی نام کاربر..." onkeyup="filterUsers()">
        <div id="admin-users"></div>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
        <h3>📦 مدیریت تمام سفارش‌ها</h3>
        <div id="admin-orders"></div>
    </div>

    <script>
        let currentUser = null;
        let allUsersCache = [];

        async function register() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if(!u || !p) return alert('نام کاربری و رمز عبور را وارد کنید.');

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if(!u || !p) return alert('نام کاربری و رمز عبور را وارد کنید.');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();

            if (res.ok) {
                currentUser = data.user;
                document.getElementById('auth-section').classList.add('hidden');

                if (currentUser.isAdmin) {
                    document.getElementById('admin-section').classList.remove('hidden');
                    loadAdminData();
                } else {
                    document.getElementById('user-section').classList.remove('hidden');
                    document.getElementById('user-name').innerText = currentUser.username;
                    document.getElementById('user-stars').innerText = currentUser.stars + ' ⭐';
                    loadProducts();
                    loadUserOrders();
                }
            } else {
                document.getElementById('auth-msg').innerText = data.error;
            }
        }

        async function loadProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const container = document.getElementById('products-list');
            container.innerHTML = '';

            if(!products || products.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">هنوز محصولی توسط مدیر اضافه نشده است.</p>';
                return;
            }

            products.forEach(p => {
                container.innerHTML += `
                    <div class="glass-item">
                        <img src="${p.image}" alt="${p.name}">
                        <h4 style="margin: 8px 0; font-size: 16px;">${p.name}</h4>
                        <p style="font-size: 13px; color: #cbd5e1; margin: 4px 0;">${p.description}</p>
                        <p style="margin: 8px 0;">قیمت: <b style="color:#fbbf24;">${p.price} ستاره</b></p>
                        <button onclick="buyProduct(${p.id})">خرید این محصول</button>
                    </div>
                `;
            });
        }

        async function loadUserOrders() {
            const res = await fetch(`/api/user/orders?userId=${currentUser.id}`);
            const orders = await res.json();
            const container = document.getElementById('user-orders-list');
            container.innerHTML = '';

            if(!orders || orders.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">شما هنوز هیچ سفارشی ثبت نکرده‌اید.</p>';
                return;
            }

            orders.forEach(o => {
                let badgeClass = 'status-pending';
                if(o.status === 'تحویل شد') badgeClass = 'status-success';
                if(o.status === 'رد شد') badgeClass = 'status-rejected';

                container.innerHTML += `
                    <div class="glass-item">
                        <b>محصول:</b> ${o.productName} (${o.price} ستاره)<br>
                        <b>تاریخ:</b> ${o.date} <br>
                        <b>وضعیت:</b> <span class="status-badge ${badgeClass}">${o.status}</span>
                    </div>
                `;
            });
        }

        async function buyProduct(productId) {
            if(!confirm('آیا از خرید این محصول مطمئن هستید؟')) return;

            const res = await fetch('/api/buy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: currentUser.id, productId })
            });
            const data = await res.json();
            alert(data.message || data.error);
            if (res.ok) {
                currentUser.stars = data.remainingStars;
                document.getElementById('user-stars').innerText = currentUser.stars + ' ⭐';
                loadUserOrders();
            }
        }

        // توابع پنل مدیریت
        async function loadAdminData() {
            const res = await fetch('/api/admin/data');
            const data = await res.json();

            document.getElementById('admin-stats').innerHTML = 
                `کاربران: ${data.stats.totalUsers} نفر | محصولات: ${data.stats.totalProducts} عدد | سفارش‌ها: ${data.stats.totalOrders} عدد`;

            allUsersCache = data.users || [];
            renderUsers(allUsersCache);

            const ordersDiv = document.getElementById('admin-orders');
            ordersDiv.innerHTML = '';
            if(!data.orders || data.orders.length === 0) ordersDiv.innerHTML = '<p style="text-align:center; color:#94a3b8;">سفارشی ثبت نشده است.</p>';

            data.orders.forEach(o => {
                let badgeClass = 'status-pending';
                if(o.status === 'تحویل شد') badgeClass = 'status-success';
                if(o.status === 'رد شد') badgeClass = 'status-rejected';

                ordersDiv.innerHTML += `
                    <div class="glass-item">
                        <b>کاربر:</b> ${o.username} <br>
                        <b>محصول:</b> ${o.productName} (${o.price} ستاره)<br>
                        <b>تاریخ:</b> ${o.date} <br>
                        <b>وضعیت فعلی:</b> <span class="status-badge ${badgeClass}">${o.status}</span>
                        <div class="flex-btn">
                            <button onclick="changeOrderStatus(${o.id}, 'تحویل شد')">✅ تحویل شد</button>
                            <button class="btn-danger" onclick="changeOrderStatus(${o.id}, 'رد شد')">❌ رد شد</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderUsers(users) {
            const usersDiv = document.getElementById('admin-users');
            usersDiv.innerHTML = '';
            users.forEach(u => {
                if(!u.isAdmin) {
                    usersDiv.innerHTML += `
                        <div class="glass-item">
                            <b>نام کاربر:</b> ${u.username} | <b>موجودی:</b> ${u.stars} ⭐<br>
                            <b>وضعیت:</b> ${u.isBanned ? '<span style="color:#f87171;">🚫 بن شده</span>' : '<span style="color:#34d399;">✅ فعال</span>'}
                            <div class="flex-btn">
                                <button onclick="updateStars(${u.id}, 5)">+5 ⭐</button>
                                <button class="btn-warning" onclick="updateStars(${u.id}, -5)">-5 ⭐</button>
                                <button class="btn-danger" onclick="toggleBan(${u.id})">${u.isBanned ? 'آنبن' : 'بن کردن'}</button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function filterUsers() {
            const query = document.getElementById('search-user').value.toLowerCase();
            const filtered = allUsersCache.filter(u => u.username.toLowerCase().includes(query));
            renderUsers(filtered);
        }

        async function updateStars(userId, amount) {
            await fetch('/api/admin/update-stars', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId, amount })
            });
            loadAdminData();
        }

        async function toggleBan(userId) {
            await fetch('/api/admin/toggle-ban', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId })
            });
            loadAdminData();
        }

        async function addProduct() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const description = document.getElementById('prod-desc').value;
            const image = document.getElementById('prod-img').value;

            if(!name || !price) return alert('نام و قیمت محصول را وارد کنید.');

            await fetch('/api/admin/add-product', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, price, description, image })
            });
            alert('محصول با موفقیت اضافه شد');
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-desc').value = '';
            document.getElementById('prod-img').value = '';
            loadAdminData();
        }

        async function changeOrderStatus(orderId, status) {
            await fetch('/api/admin/update-order-status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ orderId, status })
            });
            loadAdminData();
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
            </html>
